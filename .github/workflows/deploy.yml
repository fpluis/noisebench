name: Deploy site

# Only a push to master reaches this workflow, and only a push that touched the
# site. A pull request never runs it, which matters for a public repo: the AWS
# role's trust policy accepts the master-branch OIDC token and nothing else, so
# a contributor's fork cannot obtain credentials even by editing this file.
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "scripts/gen-static.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # mint the OIDC token that stands in for AWS keys
  contents: read

# Two deploys overlapping would race the S3 sync against the invalidation.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: publish to S3 + CloudFront
    runs-on: ubuntu-latest

    env:
      BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      DISTRIBUTION: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - uses: actions/checkout@v4

      # The pages render entirely from these files. A truncated or half-written
      # analyze.ts run would otherwise deploy a site that shows nothing, and
      # the type checker never sees this data.
      - name: Validate data files
        run: |
          if [ -z "$BUCKET" ] || [ -z "$DISTRIBUTION" ]; then
            echo "::error::Repository secrets are not set — see terraform/README.md"
            exit 1
          fi

          shopt -s nullglob
          files=(site/data/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::site/data/ has no JSON — nothing to publish"
            exit 1
          fi
          for f in "${files[@]}"; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
            echo "ok  $f"
          done

      # A page that is not in the sitemap is a page no search engine is told
      # about. `npm run sitemap` writes the file; this only catches the case
      # where a page was added and that step was skipped.
      - name: Check the sitemap covers every page
        run: |
          missing=0
          for f in site/*.html; do
            name=$(basename "$f" .html)

            # Served for every unknown path and marked noindex, so it is the one
            # page that must stay out.
            if [ "$name" = "404" ]; then
              continue
            fi

            if [ "$name" = "index" ]; then
              url="https://noisebench.com/"
            else
              url="https://noisebench.com/$name"
            fi

            if grep -qF "<loc>$url</loc>" site/sitemap.xml; then
              echo "ok  $url"
            else
              echo "::error::$url is not in site/sitemap.xml — run npm run sitemap"
              missing=1
            fi
          done
          exit $missing

      # Node 22 imports site/assets/viz.js (an ES module without a package
      # "type") on its own; older versions refuse it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Writes the results, the Q&A and the question table into the HTML and
      # regenerates llms.txt from the data being published, so crawlers that
      # do not run JavaScript read the same numbers as the charts.
      - name: Write the results into the pages
        run: node scripts/gen-static.mjs

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: noisebench-deploy-${{ github.run_id }}
          aws-region: us-east-1

      # One sync, so --delete compares the whole bucket against the whole
      # directory and there is no interaction between filters and deletion to
      # reason about.
      #
      # s-maxage is a year because the invalidation below is what actually
      # expires the CDN copy; max-age is five minutes so a browser that cached
      # a page mid-deploy catches up quickly.
      - name: Upload
        run: |
          aws s3 sync site/ "s3://$BUCKET/" --delete \
            --no-progress \
            --cache-control "public, max-age=300, s-maxage=31536000"

      # The sync guesses Content-Type from the extension and gets .html and
      # .webmanifest not-quite-right: no charset on the pages, and
      # application/octet-stream for the manifest, which Chrome refuses to
      # parse. `cp` rather than a second `sync` because sync compares size and
      # timestamp and would skip files it had just uploaded. Re-sending them
      # costs about 60 KB.
      - name: Fix content types
        run: |
          aws s3 cp site/ "s3://$BUCKET/" --recursive \
            --no-progress \
            --cache-control "public, max-age=300, s-maxage=31536000" \
            --content-type "text/html; charset=utf-8" \
            --exclude "*" --include "*.html"

          aws s3 cp site/ "s3://$BUCKET/" --recursive \
            --no-progress \
            --cache-control "public, max-age=300, s-maxage=31536000" \
            --content-type "application/manifest+json" \
            --exclude "*" --include "*.webmanifest"

      # "/*" counts as a single path against the 1,000 free invalidation paths
      # a month, so this stays free at any plausible deploy frequency.
      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" \
            --paths "/*" \
            --query Invalidation.Id --output text)
          echo "invalidation $id"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION" --id "$id"

      # A completed invalidation does not mean every edge has caught up, and on
      # the very first deploy the distribution may still be propagating, so each
      # URL gets a few tries before the deploy is called a failure.
      - name: Smoke test
        run: |
          check() {
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "https://noisebench.com$1" || echo 000)
              if [ "$code" = "200" ]; then
                echo "200  $1"
                return 0
              fi
              sleep 10
            done
            echo "::error::$1 answered $code after 5 attempts"
            return 1
          }

          for path in / /compare /markets /details /data/metrics.json /robots.txt /sitemap.xml /llms.txt; do
            check "$path" || exit 1
          done

      # Tell the IndexNow engines — Bing, Yandex, Seznam, Naver — that these
      # URLs changed, rather than waiting to be crawled. One submission reaches
      # every participant; Google does not take part and finds the run through
      # the sitemap instead. What proves the submission is site/$KEY.txt, which
      # the sync above has just published at the root.
      #
      # Runs last and never fails the job: the deploy has already passed its
      # smoke test, and a refused submission changes nothing that is live.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          KEY: df228dfe80a12ef4fd056907a3065f86
        run: |
          payload=$(node -e '
            const fs = require("fs");
            const xml = fs.readFileSync("site/sitemap.xml", "utf8");
            const urls = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1]);
            process.stdout.write(JSON.stringify({
              host: "noisebench.com",
              key: process.env.KEY,
              keyLocation: `https://noisebench.com/${process.env.KEY}.txt`,
              urlList: urls,
            }));
          ')

          code=$(curl -sS -X POST https://api.indexnow.org/IndexNow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload" \
            -o response.txt -w '%{http_code}')

          # 200 accepted, 202 accepted with the key still being checked.
          echo "IndexNow answered $code"
          cat response.txt
